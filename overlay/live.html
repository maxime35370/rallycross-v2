<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>RX Chrono — Overlay OBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Barlow+Condensed:wght@400;500;600;700&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_lib/overlay.css">
</head>
<body>
<div class="overlay-root" id="root"></div>

<script type="module">
  import { initFirebase, fsQuery, watchQuery, getDocById } from './_lib/obs-firebase.js';
  import { watchControl, sessionKey } from './_lib/obs-control.js';
  import {
    getSessions, getResults, findSession, sortRace, getInterim, getInterimBefore,
    getChampionshipStandings, getMeetingPoints, getGridOrder, getGridLayout, getEcRank, getMqRank,
  } from './_lib/obs-data.js';
  import { renderScene, countdownText } from './_lib/obs-scenes.js';

  const root = document.getElementById('root');
  // fond sombre par défaut ; ?transparent=1 → fond transparent (superposition vidéo OBS)
  if (new URLSearchParams(location.search).get('transparent')) document.body.classList.add('transparent');

  function diag(msg, sub) {
    root.innerHTML = `<div class="ov-diag"><div class="t">🏁 RX CHRONO</div>
      <div class="m">${msg}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`;
  }
  diag('Connexion…');

  await initFirebase();
  diag('En attente de la régie…');

  // Caches (évitent de recharger ce qui ne change pas)
  let championships = [];
  let cacheKey = '';          // sélection courante (meeting|cat|type|num|scene)
  let unsubResults = null;    // listener live des résultats de la session courante
  let champTimer = null;
  let cdTimer = null;         // ticker du compte à rebours (écran d'attente)
  let sessTimer = null;       // effacement différé de la surbrillance (dernier de la manche)
  let lastControl = null;
  let champRows = [];         // classement championnat (rafraîchi périodiquement)

  function labelFor(type, num) {
    if (type === 'EC')  return 'Essais chronométrés';
    if (type === 'MQ')  return 'Manche ' + (num ?? 1);
    if (type === 'QF')  return '¼ de finale ' + (num ?? 1);
    if (type === 'DF')  return 'Demi-finale ' + (num ?? 1);
    if (type === 'FIN') return 'Finale';
    return '';
  }

  function applyVisibility(visible) {
    root.classList.toggle('hidden', !visible);
  }

  async function resolveRegulation(champId) {
    if (!championships.length) championships = await fsQuery('championships', []);
    return championships.find(c => c.id === champId)
        || championships.find(c => c.isActive)
        || championships[0] || null;
  }

  async function meetingsOf(reg) {
    if (!reg) return [];
    const all = await fsQuery('meetings', [['year', '==', reg.year]]);
    return all.filter(m => m.championshipId === reg.id || !m.championshipId);
  }

  // Recharge complète sur changement de sélection
  async function reload(ctrl) {
    if (unsubResults) { unsubResults(); unsubResults = null; }
    if (champTimer)   { clearInterval(champTimer); champTimer = null; }
    if (cdTimer)      { clearInterval(cdTimer); cdTimer = null; }
    if (sessTimer)    { clearTimeout(sessTimer); sessTimer = null; }

    // Écran d'attente : indépendant du meeting/catégorie + compte à rebours
    if (ctrl.scene === 'intermission') {
      root.innerHTML = renderScene('intermission', {
        headerText: ctrl.headerText, nextText: ctrl.nextText,
        countdownEnd: ctrl.countdownEnd, social: ctrl.headerText,
      });
      if (ctrl.countdownEnd) {
        const tick = () => { const el = document.getElementById('ov-cd'); if (el) el.textContent = countdownText(ctrl.countdownEnd); };
        tick(); cdTimer = setInterval(tick, 1000);
      }
      return;
    }

    const reg = await resolveRegulation(ctrl.championshipId);
    if (!reg || !ctrl.meetingId || !ctrl.category) {
      root.innerHTML = renderScene(ctrl.scene, { headerText: ctrl.headerText, category: ctrl.category });
      return;
    }

    const sessions = await getSessions(ctrl.meetingId, ctrl.category);
    const session  = findSession(sessions, ctrl.sessionType, ctrl.sessionNum);
    const sLabel   = labelFor(ctrl.sessionType, ctrl.sessionNum);

    // Scène "Grille" pour ESSAIS / MANCHES : vue multi-colonnes en direct
    // (à passer | classement | intermédiaire). Le pilote quitte "à passer"
    // dès qu'un chrono/statut apparaît dans results.
    if (ctrl.scene === 'grid' && ['EC', 'MQ'].includes(ctrl.sessionType) && session) {
      const order = await getGridOrder(session, sessions, reg, await meetingsOf(reg));
      // dernière manche ? → on affiche les points championnat (interimPoints) dans l'intermédiaire
      const mqNums = sessions.filter(s => s.type === 'MQ').map(s => s.num ?? 1);
      const isLastManche = ctrl.sessionType === 'MQ' && mqNums.length && (ctrl.sessionNum ?? 1) === Math.max(...mqNums);
      let prevIds = null;     // pilotes déjà classés (pour détecter les nouveaux → flash)
      let lastAddedId = null; // pilote en surbrillance (reste jusqu'à la saisie suivante)
      let lastResults = [];   // derniers résultats reçus (pour re-render différé)
      // Référence "remontada" : classement intermédiaire AVANT cette manche (fixe)
      const baselinePos = {};
      if (ctrl.sessionType === 'MQ') {
        (await getInterimBefore(ctrl.meetingId, ctrl.category, reg, session.id).catch(() => []))
          .forEach(r => { baselinePos[r.driverId] = r.position; });
      }
      const hasBaseline = Object.keys(baselinePos).length > 0;
      const renderSess = async (results) => {
        if (results) lastResults = results;
        const resMap = {};
        lastResults.forEach(r => { resMap[r.driverId] = r; });
        const hasRun = id => !!(resMap[id] && (resMap[id].ms != null || resMap[id].status));
        const rank = ctrl.sessionType === 'EC'
          ? await getEcRank(sessions, reg).catch(() => [])
          : await getMqRank(session, reg).catch(() => []);
        const curIds = new Set(rank.map(r => r.driverId).filter(Boolean));
        // nouveau(x) ce render → fondu une seule fois ; le dernier garde la barre
        let flashIds = new Set();
        if (prevIds) {
          const newcomers = [...curIds].filter(id => !prevIds.has(id));
          if (newcomers.length) {
            flashIds = new Set(newcomers);
            lastAddedId = newcomers[newcomers.length - 1];
            if (sessTimer) { clearTimeout(sessTimer); sessTimer = null; }
          }
        }
        const mark = r => {
          if (!r.driverId) return;
          if (r.driverId === lastAddedId) r.justAdded = true;   // barre persistante
          if (flashIds.has(r.driverId)) r.justFlashed = true;   // fondu (à l'entrée)
        };
        rank.forEach(mark);
        const todo = order.filter(o => !hasRun(o.driverId)).map((o, i) => ({ pos: i + 1, carNumber: o.carNumber, lastName: o.lastName }));
        const data = {
          mode: ctrl.sessionType === 'EC' ? 'ec' : 'mq',
          headerText: ctrl.headerText, sessionLabel: `${sLabel} · ${ctrl.category}`,
          todo, rank,
        };
        if (ctrl.sessionType !== 'EC') {
          const interim = (await getInterim(ctrl.meetingId, ctrl.category, reg).catch(() => []))
            .map(r => ({ driverId: r.driverId, position: r.position, carNumber: r.carNumber, lastName: r.lastName,
              totalPoints: r.totalPoints, done: hasRun(r.driverId),       // done = déjà un résultat dans CETTE manche
              champPts: isLastManche ? (r.interimPoints ?? 0) : null }));  // pts championnat (dernière manche)
          if (hasBaseline) interim.forEach(r => {             // delta = places gagnées depuis AVANT la manche
            r.delta = baselinePos[r.driverId] != null ? baselinePos[r.driverId] - r.position : 'new';
          });
          interim.forEach(mark);
          data.interim = interim;
        }
        root.innerHTML = renderScene('session', data);
        prevIds = curIds;
        // dernier de la manche (plus personne à passer) → effacer la surbrillance après 10 s
        if (lastAddedId && todo.length === 0 && !sessTimer) {
          sessTimer = setTimeout(() => { lastAddedId = null; sessTimer = null; renderSess(null); }, 10000);
        }
      };
      unsubResults = await watchQuery('results', [['sessionId', '==', session.id]], rows => renderSess(rows));
      return;
    }

    // Grille (override d'affichage prioritaire si la clé correspond)
    let slots = [];
    if (['grid', 'next-heat'].includes(ctrl.scene)) {
      const ov = ctrl.gridOverride;
      if (ov && ov.key === sessionKey(ctrl) && ov.slots?.length) {
        slots = ov.slots;
      } else if (session) {
        slots = await getGridOrder(session, sessions, reg, await meetingsOf(reg));
      }
    }
    const layout = getGridLayout(reg, ctrl.sessionType);
    // sens du 1er virage (pole gauche/droite) pour la grille en quinconce
    let poleSide = null;
    if (ctrl.scene === 'grid' && Object.keys(layout.positions || {}).length) {
      poleSide = (await getDocById('meetings', ctrl.meetingId).catch(() => null))?.poleSide || null;
    }

    // Championnat : référence AVANT l'épreuve (meeting exclu), calculée 1 fois ;
    // puis on ajoute en direct les points du meeting en cours (léger) → total + flèches + (+meeting).
    let champBeforeTot = {}, champBeforePos = {}, drvInfo = {};
    if (ctrl.scene === 'dashboard') {
      const all = await meetingsOf(reg);
      (await getChampionshipStandings(all.filter(m => m.id !== ctrl.meetingId), ctrl.category, reg).catch(() => []))
        .forEach(r => { champBeforeTot[r.driverId] = r.grandTotal; champBeforePos[r.driverId] = r.position; drvInfo[r.driverId] = r; });
    }
    const hasChampBefore = Object.keys(champBeforeTot).length > 0;
    const buildChamp = async () => {
      const cur = await getMeetingPoints(ctrl.meetingId, ctrl.category, reg).catch(() => []);
      const curTot = {};
      cur.forEach(d => { curTot[d.driverId] = d.total; if (!drvInfo[d.driverId]) drvInfo[d.driverId] = d; });
      const ids = new Set([...Object.keys(champBeforeTot), ...Object.keys(curTot)]);
      const rows = [...ids].map(id => ({
        driverId: id, carNumber: drvInfo[id]?.carNumber, lastName: drvInfo[id]?.lastName,
        grandTotal: (champBeforeTot[id] || 0) + (curTot[id] || 0),
        meetingPts: hasChampBefore ? (curTot[id] || 0) : null,
      }));
      rows.sort((a, b) => b.grandTotal - a.grandTotal);
      let cp = 1;
      rows.forEach((r, i) => {
        r.position = (i > 0 && r.grandTotal === rows[i - 1].grandTotal) ? rows[i - 1].position : cp;
        cp = i + 2;
        r.delta = hasChampBefore ? (champBeforePos[r.driverId] != null ? champBeforePos[r.driverId] - r.position : 'new') : null;
      });
      return rows;
    };

    // Fonction de rendu (recalcule intermédiaire + championnat à chaque tick résultats)
    const renderNow = async (raceResults) => {
      const data = {
        headerText: ctrl.headerText, category: ctrl.category, sessionLabel: sLabel,
        raceSub: `${ctrl.category} · ${sLabel}`, interimSub: 'classement intermédiaire',
        champSub: `${ctrl.category} · ${reg.year}`, social: ctrl.headerText,
        layout, slots, poleSide,
      };
      if (ctrl.scene === 'dashboard') {
        data.race    = sortRace(raceResults || []);
        data.interim = await getInterim(ctrl.meetingId, ctrl.category, reg).catch(() => []);
        data.champ   = await buildChamp();
      }
      root.innerHTML = renderScene(ctrl.scene, data);
    };

    if (ctrl.scene === 'dashboard' && session) {
      // Live : on s'abonne aux résultats de la session courante
      unsubResults = await watchQuery('results', [['sessionId', '==', session.id]], rows => renderNow(rows));
    } else {
      await renderNow(session ? await getResults(session.id) : []);
    }
  }

  // Boucle de contrôle (avec reconnexion auto du listener)
  let ctrlUnsub = null;
  async function startControl() {
    if (ctrlUnsub) { ctrlUnsub(); ctrlUnsub = null; }
    ctrlUnsub = await watchControl(async (ctrl) => {
      applyVisibility(ctrl.visible);
      const key = [ctrl.scene, ctrl.championshipId, ctrl.meetingId, ctrl.category,
                   ctrl.sessionType, ctrl.sessionNum, JSON.stringify(ctrl.gridOverride),
                   ctrl.headerText, ctrl.nextText, ctrl.countdownEnd].join('|');
      if (key === cacheKey) return;   // rien de pertinent n'a changé
      cacheKey = key;
      lastControl = ctrl;
      try { await reload(ctrl); }
      catch (e) { console.error('[overlay] reload', e); diag('Erreur de chargement', e.message); }
    }, (err) => {
      diag('Erreur Firestore', err.code === 'permission-denied'
        ? 'Règle « obsControl » manquante — ajoute-la dans la console Firebase (voir README).'
        : (err.code || err.message));
      cacheKey = '';
      setTimeout(startControl, 5000);   // reconnexion auto (règle ajoutée, coupure réseau…)
    });
  }
  startControl();
</script>
</body>
</html>
