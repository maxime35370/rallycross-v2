<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>RX Chrono — Overlay OBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Barlow+Condensed:wght@400;500;600;700&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_lib/overlay.css">
</head>
<body>
<div class="overlay-root" id="root"></div>

<script type="module">
  import { initFirebase, fsQuery, watchQuery, getDocById } from './_lib/obs-firebase.js';
  import { watchControl, sessionKey } from './_lib/obs-control.js';
  import {
    getSessions, getResults, getParticipants, findSession, sortRace, getInterim, getInterimLive, getInterimBefore,
    getCumulBefore, getInterimEvolution, getChampionshipStandings, getMeetingPoints, getMeetingStandings, getGridOrder, getGridLayout,
    getFicheData, getQualifCutoff, getEcRank, getMqRank, getPhaseRank,
  } from './_lib/obs-data.js';
  import { renderScene, countdownText } from './_lib/obs-scenes.js';
  import { buildPrediction } from './_lib/obs-predict.js';
  import { watchPronostic } from './_lib/obs-pronostics.js';
  import { qrDataUrl, spectatorUrl } from './_lib/obs-qr.js';

  const root = document.getElementById('root');
  const qs = new URLSearchParams(location.search);
  // fond sombre par défaut ; ?transparent=1 → fond transparent (superposition vidéo OBS)
  if (qs.get('transparent')) document.body.classList.add('transparent');
  // ?preview=1 → moniteur d'aperçu régie : on n'active PAS la caméra (pas de getUserMedia)
  const PREVIEW = !!qs.get('preview');

  function diag(msg, sub) {
    root.innerHTML = `<div class="ov-diag"><div class="t">🏁 RX CHRONO</div>
      <div class="m">${msg}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`;
  }
  diag('Connexion…');

  await initFirebase();
  diag('En attente de la régie…');

  // Caches (évitent de recharger ce qui ne change pas)
  let championships = [];
  let cacheKey = '';          // sélection courante (meeting|cat|type|num|scene)
  let reloadGen = 0;          // jeton anti-course : seul le reload le plus récent peut peindre / s'abonner
  let unsubResults = null;    // listener live des résultats de la session courante
  let pronoUnsub = null;      // listener live du doc pronostic (scène « pronostic »)
  let champTimer = null;
  let cdTimer = null;         // ticker du compte à rebours (écran d'attente)
  let sessTimer = null;       // effacement différé de la surbrillance (dernier de la manche)
  let lastControl = null;
  let champRows = [];         // classement championnat (rafraîchi périodiquement)
  const meetingsCache = new Map();   // regId|year → meetings (liste fixe pendant l'épreuve)
  const baselineCache = new Map();   // champId|cat|meetingId → classement championnat AVANT l'épreuve
  let renderTimer = null;            // debounce des saisies (annulé au changement de scène)

  // Délai (ms) de regroupement des saisies : un seul recalcul après une rafale de saisies.
  const SAISIE_DELAY = 900;
  // Rend le 1er instantané immédiatement (changement de scène), puis regroupe les
  // mises à jour suivantes (saisies) : recalcul unique après SAISIE_DELAY.
  function freshThenDebounce(fn) {
    let first = true, lastArgs;
    return (...args) => {
      lastArgs = args;
      if (first) { first = false; fn(...args); return; }
      clearTimeout(renderTimer);
      renderTimer = setTimeout(() => fn(...lastArgs), SAISIE_DELAY);
    };
  }

  // nom affichable d'une catégorie depuis son id (les sessions utilisent l'id = c.id || c.name)
  function catLabel(reg, id) {
    return (reg?.categories || []).find(c => (c.id || c.name) === id)?.name || id || '';
  }

  function labelFor(type, num) {
    if (type === 'EC')  return 'Essais chronométrés';
    if (type === 'MQ')  return 'Manche ' + (num ?? 1);
    if (type === 'QF')  return '¼ de finale ' + (num ?? 1);
    if (type === 'DF')  return 'Demi-finale ' + (num ?? 1);
    if (type === 'FIN') return 'Finale';
    return '';
  }

  function applyVisibility(visible) {
    root.classList.toggle('hidden', !visible);
  }

  // ─────────────────────────────────────────────────────────
  // ÉTAGE VIDÉO (caméra locale OU lien) composé dans la page
  //   Élément persistant hors de #root ; placement piloté par ctrl.videoLayout,
  //   source par ctrl.videoSource ({type:'camera'|'url', value}).
  // ─────────────────────────────────────────────────────────
  let vidStage, vidStartBtn, vidErrEl, vidEl;
  let vidMode = '', vidUrl = '', vidStarted = false, vidStream = null, vidWantId = '';
  const CAM_KEY = 'rxchrono.camDeviceId';

  function ensureVidEls() {
    if (vidStage) return;
    vidStage = document.createElement('div'); vidStage.id = 'vid-stage';
    vidEl = document.createElement('video'); vidEl.id = 'vid-el';
    vidEl.autoplay = true; vidEl.muted = true; vidEl.setAttribute('playsinline', '');
    document.body.appendChild(vidStage);
    vidStartBtn = document.createElement('button'); vidStartBtn.id = 'vid-start';
    vidStartBtn.textContent = '📷 Démarrer caméra';
    vidStartBtn.onclick = () => startCamera(vidWantId);
    document.body.appendChild(vidStartBtn);
    vidErrEl = document.createElement('div'); vidErrEl.id = 'vid-err';
    document.body.appendChild(vidErrEl);
  }
  const vidErr = msg => { vidErrEl.textContent = msg || ''; vidErrEl.classList.toggle('show', !!msg); };
  const showStart = show => vidStartBtn.classList.toggle('show', show);

  // URL → embed lisible (YouTube live → iframe embed ; sinon URL telle quelle : VDO.Ninja…)
  function embedUrl(u) {
    try {
      const url = new URL(u);
      let id = '';
      if (/youtube\.com$/.test(url.hostname) || /youtube\.com/.test(url.hostname)) {
        id = url.searchParams.get('v') || (url.pathname.match(/\/(?:live|embed|shorts)\/([\w-]+)/) || [])[1] || '';
      } else if (url.hostname.includes('youtu.be')) { id = url.pathname.slice(1); }
      // enablejsapi=1 → on peut piloter le volume (postMessage). mute=1 : requis pour l'autoplay.
      if (id) return `https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&modestbranding=1&playsinline=1&rel=0&enablejsapi=1`;
    } catch (e) { /* pas une URL standard */ }
    return u;   // VDO.Ninja & autres liens embarquables : tels quels
  }

  // Volume du lien YouTube : piloté via l'API du lecteur (postMessage).
  //  0 = muet ; > 0 = son (dé-mute + volume). L'autoplay démarre muet, on dé-mute
  //  à la demande (fiable dans OBS ; dans un simple onglet, un clic peut être requis).
  let vidVolume = 0, vidIsYt = false;
  function ytCmd(func, args) {
    const f = vidStage && vidStage.querySelector('iframe');
    try { if (f && f.contentWindow) f.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: args || [] }), '*'); } catch (e) {}
  }
  function applyVolume() {
    if (!vidIsYt) return;
    if (vidVolume > 0) { ytCmd('unMute'); ytCmd('setVolume', [vidVolume]); }
    else ytCmd('mute');
  }

  async function startCamera(deviceId) {
    vidErr(''); showStart(false);
    try {
      if (vidStream) vidStream.getTracks().forEach(t => t.stop());
      vidStream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: deviceId ? { deviceId: { exact: deviceId } } : { width: { ideal: 1920 }, height: { ideal: 1080 } },
      });
      vidEl.srcObject = vidStream; vidStarted = true;
      const id = vidStream.getVideoTracks()[0]?.getSettings().deviceId;
      if (id) { localStorage.setItem(CAM_KEY, id); vidWantId = id; }
    } catch (e) {
      vidStarted = false; showStart(true);
      vidErr('Caméra : ' + ({ NotAllowedError: 'autorisation refusée (autorise la caméra pour ce site).',
        NotFoundError: 'aucune caméra (vérifie le câble USB-C data / le mode webcam).',
        NotReadableError: 'caméra occupée par une autre application.' }[e.name] || e.message));
    }
  }
  function stopCamera() { if (vidStream) { vidStream.getTracks().forEach(t => t.stop()); vidStream = null; } vidStarted = false; }

  function setStageVideo() {
    if (vidMode === 'cam') return;
    vidStage.innerHTML = ''; vidStage.appendChild(vidEl); vidMode = 'cam'; vidUrl = '';
  }
  function setStageIframe(url, isYt) {
    if (vidMode === 'url' && vidUrl === url) return;
    vidStage.innerHTML = `<iframe src="${url}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    vidMode = 'url'; vidUrl = url; vidIsYt = !!isYt;
    const f = vidStage.querySelector('iframe');
    if (f) f.addEventListener('load', () => setTimeout(applyVolume, 400));   // volume dès que le lecteur est prêt
  }

  // Appliqué à CHAQUE mise à jour du contrôle (indépendant du rechargement de scène) :
  // change la source/placement/volume de la vidéo sans re-render les tableaux.
  function applyVideo(ctrl) {
    ensureVidEls();
    const layout = ctrl.videoLayout || 'none';
    const src = ctrl.videoSource || { type: 'camera', value: '' };
    const off = layout === 'none' || !ctrl.visible;   // suit aussi le masquage global de l'overlay
    vidStage.className = off ? '' : ('on ' + layout);
    if (off) { showStart(false); vidErr(''); return; }
    if (src.type === 'url' && src.value) {
      stopCamera(); showStart(false); vidErr('');
      const emb = embedUrl(src.value);
      setStageIframe(emb, emb.includes('youtube.com/embed'));
      vidVolume = Math.max(0, Math.min(100, ctrl.videoVolume ?? 0));
      applyVolume();
    } else if (PREVIEW) {
      // aperçu régie : on ne déclenche pas la caméra, juste un repère
      vidStage.innerHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#7a8699;font-family:Orbitron,sans-serif;font-weight:800;font-size:20px;letter-spacing:2px">📷 CAM</div>';
      vidMode = 'preview'; showStart(false);
    } else {
      setStageVideo();
      const want = src.value || localStorage.getItem(CAM_KEY) || '';
      if (!vidStarted) { vidWantId = want; showStart(true); }
      else if (want && want !== vidWantId) { startCamera(want); }   // changement de caméra en direct
    }
  }

  // Bandeau info / sponsors (persistant, par-dessus la scène). Ne se reconstruit
  // que si le contenu change (évite le clignotement à chaque changement de scène).
  let _lastIbSig = '';
  function applyInfoBand(ctrl) {
    const ib = ctrl.infoBand || {};
    const on = !!ib.enabled && ctrl.visible !== false;
    let el = document.getElementById('info-band');
    if (!on) { if (el) el.classList.remove('on'); _lastIbSig = ''; return; }
    if (!el) {
      el = document.createElement('div'); el.id = 'info-band';
      el.innerHTML = '<div class="ib-badge"></div><div class="ib-msg"><span class="ib-scroll"></span></div><div class="ib-logos"></div>';
      document.body.appendChild(el);
    }
    const label = (ib.label || '').trim(), msg = (ib.message || '').trim();
    const arr = Array.isArray(ib.logos) ? ib.logos : [];
    const sig = label + '|' + msg + '|' + arr.map(s => (s || '').length).join(',');
    if (sig !== _lastIbSig) {
      _lastIbSig = sig;
      const badge = el.querySelector('.ib-badge'), msgWrap = el.querySelector('.ib-msg');
      const scroll = el.querySelector('.ib-scroll'), logos = el.querySelector('.ib-logos');
      badge.textContent = label; badge.style.display = label ? '' : 'none';
      scroll.textContent = msg; msgWrap.style.display = msg ? '' : 'none';
      logos.innerHTML = '';
      arr.forEach(src => { const img = document.createElement('img'); img.src = src; img.alt = ''; logos.appendChild(img); });
      logos.style.display = arr.length ? '' : 'none';
      requestAnimationFrame(() => { msgWrap.classList.toggle('scroll', scroll.scrollWidth > msgWrap.clientWidth + 4); });
    }
    el.classList.add('on');
  }

  async function resolveRegulation(champId) {
    if (!championships.length) championships = await fsQuery('championships', []);
    return championships.find(c => c.id === champId)
        || championships.find(c => c.isActive)
        || championships[0] || null;
  }

  async function meetingsOf(reg) {
    if (!reg) return [];
    const key = reg.id + '|' + reg.year;
    if (meetingsCache.has(key)) return meetingsCache.get(key);
    const all = await fsQuery('meetings', [['year', '==', reg.year]]);
    const list = all.filter(m => m.championshipId === reg.id || !m.championshipId);
    meetingsCache.set(key, list);
    return list;
  }

  // Classement championnat AVANT l'épreuve (meetings passés) : ne change pas pendant
  // l'épreuve → calculé une seule fois, réutilisé à chaque changement de scène.
  // (Pour forcer un recalcul — ex. édition d'un meeting passé — recharger la source OBS.)
  async function championshipBaseline(reg, meetingId, category) {
    const key = reg.id + '|' + category + '|' + meetingId;
    if (baselineCache.has(key)) return baselineCache.get(key);
    const all = await meetingsOf(reg);
    const standings = await getChampionshipStandings(all.filter(m => m.id !== meetingId), category, reg).catch(() => []);
    const base = { tot: {}, pos: {}, info: {} };
    standings.forEach(r => { base.tot[r.driverId] = r.grandTotal; base.pos[r.driverId] = r.position; base.info[r.driverId] = r; });
    baselineCache.set(key, base);
    return base;
  }

  // Bandeau prédiction : recalculé EN DIRECT à chaque saisie (les abandons déjà
  // saisis sont figés → une remontada redevient possible si un leader abandonne).
  //  • p1 / qualif  → base = cumul AVANT la manche (intermédiaire), pendant les MQ
  //  • champ_*      → base = championnat AVANT la finale, pendant les phases finales
  // La base (avant la session) est figée pendant la session → mise en cache ;
  // seul le « live » (abandons, places) est relu à chaque tick.
  const cumulBeforeCache = new Map();   // meeting|cat|sessRank → cumul avant la manche
  const champBaseCache   = new Map();   // meeting|cat → {tot, info} championnat avant la finale
  const OUT_STATUS = new Set(['DNF', 'DSQ_RACE', 'DNS', 'DSQ']);

  async function cumulBeforeOf(ctrl, reg, session) {
    const k = [ctrl.meetingId, ctrl.category, session.type, session.num].join('|');
    if (!cumulBeforeCache.has(k)) cumulBeforeCache.set(k, await getCumulBefore(ctrl.meetingId, ctrl.category, reg, session).catch(() => []));
    return cumulBeforeCache.get(k);
  }
  async function champBaseOf(ctrl, reg) {
    const k = ctrl.meetingId + '|' + ctrl.category;
    if (!champBaseCache.has(k)) {
      const all = await meetingsOf(reg);
      const perM = await Promise.all(all.map(m => m.id === ctrl.meetingId
        ? getMeetingPoints(m.id, ctrl.category, reg, { type: 'DF', num: 99 })   // jusqu'aux demis (exclut la finale)
        : getMeetingPoints(m.id, ctrl.category, reg))).catch(() => []);
      const tot = {}, info = {};
      perM.forEach(rows => (rows || []).forEach(d => { tot[d.driverId] = (tot[d.driverId] || 0) + d.total; info[d.driverId] = d; }));
      champBaseCache.set(k, { tot, info });
    }
    return champBaseCache.get(k);
  }

  async function computePredict(ctrl, reg, session, liveRank) {
    const p = ctrl.predict;
    if (!p || !p.enabled || !p.driverId) return null;
    if (!['dashboard', 'grid'].includes(ctrl.scene)) return null;
    const obj = p.objective || 'p1';

    if (obj === 'p1' || obj === 'qualif') {
      if (!session || session.type !== 'MQ') return null;   // objectifs manche : pendant les MQ
      // place qualificative = cutoff du RÈGLEMENT (auto) ; valeur régie = secours si indéterminable
      const cutoff = getQualifCutoff(reg) || (p.cutoff > 0 ? p.cutoff : 6);
      const before = await cumulBeforeOf(ctrl, reg, session);
      const dInfo = before.find(b => b.driverId === p.driverId);
      if (!dInfo) return null;
      const rank = liveRank || await getMqRank(session, reg).catch(() => []);
      const rmap = {}; rank.forEach(r => { if (r.driverId) rmap[r.driverId] = r; });
      const dr = rmap[p.driverId];
      if (dr && OUT_STATUS.has(dr.status)) {   // pilote choisi a abandonné → bandeau neutre
        return { ok: true, scope: 'INTERMÉDIAIRE',
          objectiveLabel: obj === 'qualif' ? `Place qualificative · top ${cutoff}` : "Tête de l'intermédiaire",
          driver: dInfo, meta: `Abandon · +${typeof dr.points === 'number' ? dr.points : 0} pts cette manche`,
          state: 'lost', pill: { text: 'ABANDON', tone: 'bad' },
          lines: [{ icon: '🚩', text: `N°${dInfo.carNumber} ${(dInfo.lastName || '').toUpperCase()} a abandonné la manche — classement à figer en fin de manche.` }] };
      }
      // abandons déjà saisis → total figé (points acquis) + retirés des "mobiles"
      const standings = before.map(b => {
        const r = rmap[b.driverId]; const out = r && OUT_STATUS.has(r.status);
        return { driverId: b.driverId, carNumber: b.carNumber, lastName: b.lastName,
          total: (b.total ?? 0) + (out ? (typeof r.points === 'number' ? r.points : 0) : 0), _out: out };
      });
      const movingIds = standings.filter(s => !s._out).map(s => s.driverId);
      return buildPrediction({ objective: obj, standings, driverId: p.driverId, regulation: reg, cutoff, movingIds });
    }

    // niveau 2 — championnat (phases finales)
    if (!['QF', 'DF', 'FIN'].includes(ctrl.sessionType) || !session) return null;
    const { tot, info } = await champBaseOf(ctrl, reg);
    if (!Object.keys(tot).length) return null;
    const ranks = liveRank || await getPhaseRank(session, reg).catch(() => []);
    const rmap = {}; (ranks || []).forEach(r => { if (r.driverId) rmap[r.driverId] = r; });
    const parts = (await getParticipants(session.id).catch(() => [])).map(x => x.driverId);
    const inSet = new Set(parts);
    const standings = Object.keys(tot).map(id => {
      const r = rmap[id]; const out = inSet.has(id) && r && OUT_STATUS.has(r.status);
      return { driverId: id, carNumber: info[id]?.carNumber, lastName: info[id]?.lastName,
        total: (tot[id] ?? 0) + (out ? (typeof r.points === 'number' ? r.points : 0) : 0) };
    });
    // mobiles = engagés de la finale NON abandonnés (seuls eux marquent encore)
    const movingIds = parts.filter(id => { const r = rmap[id]; return !(r && OUT_STATUS.has(r.status)); });
    return buildPrediction({ objective: obj, standings, driverId: p.driverId, regulation: reg, sessionType: ctrl.sessionType, inSessionIds: movingIds });
  }

  // Recharge complète sur changement de sélection
  async function reload(ctrl) {
    const gen = ++reloadGen;                 // ce reload supersede tout reload précédent encore en vol
    const alive = () => gen === reloadGen;   // false dès qu'un reload plus récent démarre (2e clic de scène)
    if (unsubResults) { unsubResults(); unsubResults = null; }
    if (champTimer)   { clearInterval(champTimer); champTimer = null; }
    if (cdTimer)      { clearInterval(cdTimer); cdTimer = null; }
    if (sessTimer)    { clearTimeout(sessTimer); sessTimer = null; }
    if (renderTimer)  { clearTimeout(renderTimer); renderTimer = null; }   // annule un recalcul de saisie en attente
    if (pronoUnsub)   { pronoUnsub(); pronoUnsub = null; }

    // Écran d'attente / Fin de stream : indépendants du meeting/catégorie + compte à rebours
    if (ctrl.scene === 'intermission' || ctrl.scene === 'ending') {
      root.innerHTML = renderScene(ctrl.scene, {
        headerText: ctrl.headerText, nextText: ctrl.nextText,
        countdownEnd: ctrl.countdownEnd, social: ctrl.headerText,
      });
      if (ctrl.countdownEnd) {
        const tick = () => { const el = document.getElementById('ov-cd'); if (el) el.textContent = countdownText(ctrl.countdownEnd); };
        tick(); cdTimer = setInterval(tick, 1000);
      }
      return;
    }

    // Scène "Pronostic" : résultats des votes spectateurs. Indépendante de la
    // sélection courante — on suit le doc pronostic en direct (statut + décompte
    // figé à la fermeture). Aucun chiffre tant que le vote est ouvert
    // (l'affichage est géré dans renderPronostic selon p.status).
    if (ctrl.scene === 'pronostic') {
      const pid = ctrl.pronosticId || '';
      const reg0 = await resolveRegulation(ctrl.championshipId).catch(() => null);
      const paint = (p) => {
        if (!alive()) return;                   // reload superseded (changement de scène) → ne repeint pas
        const catId = (p && p.category) || ctrl.category || '';
        const cName = reg0 ? catLabel(reg0, catId) : catId;
        const url = spectatorUrl(ctrl.spectatorBaseUrl, ctrl.meetingId);   // event-global (toutes catégories)
        root.innerHTML = renderScene('pronostic', {
          headerText: ctrl.headerText || ['RX Chrono', cName].filter(Boolean).join(' · '),
          category: cName,
          voteUrl: url.replace(/^https?:\/\//, ''),
          qrDataUrl: qrDataUrl(url, { cell: 6, margin: 2 }),
          pronostic: p,
        });
      };
      if (!pid) { paint(null); return; }
      const pu = await watchPronostic(pid, paint, () => paint(null));
      if (!alive()) { pu(); return; }           // périmé → jette l'abonnement
      pronoUnsub = pu;
      return;
    }

    const reg = await resolveRegulation(ctrl.championshipId);
    if (!alive()) return;                       // 2e clic arrivé pendant l'attente → ce reload est périmé
    if (!reg || !ctrl.meetingId || !ctrl.category) {
      root.innerHTML = renderScene(ctrl.scene, { headerText: ctrl.headerText, category: ctrl.category });
      return;
    }

    const sessions = await getSessions(ctrl.meetingId, ctrl.category);
    const session  = findSession(sessions, ctrl.sessionType, ctrl.sessionNum);
    const sLabel   = labelFor(ctrl.sessionType, ctrl.sessionNum);
    const catName  = catLabel(reg, ctrl.category);   // nom affichable (la requête utilise ctrl.category = id)
    const meeting  = await getDocById('meetings', ctrl.meetingId).catch(() => null);
    // en-tête : texte saisi, sinon par défaut « Circuit · Catégorie · Phase »
    const headerText = ctrl.headerText || [meeting?.location, catName, sLabel].filter(Boolean).join(' · ');

    // Scène "Fiche pilote / Duel" : 1 pilote → fiche ; 2 → duel (même catégorie).
    if (ctrl.scene === 'fiche') {
      const ids = [ctrl.fiche?.driverId1, ctrl.fiche?.driverId2].filter(Boolean);
      const fHeader = ctrl.headerText || [meeting?.location, catName].filter(Boolean).join(' · ');
      const fd = await getFicheData(ctrl.meetingId, ctrl.category, reg, ids, await meetingsOf(reg)).catch(() => ({ drivers: [] }));
      if (!alive()) return;                     // 2e clic pendant getFicheData → ne pas écraser la nouvelle scène
      root.innerHTML = renderScene('fiche', { headerText: fHeader, category: catName, drivers: fd.drivers });
      return;
    }

    // Scène "Grille" pour ESSAIS / MANCHES : vue multi-colonnes en direct
    // (à passer | classement | intermédiaire). Le pilote quitte "à passer"
    // dès qu'un chrono/statut apparaît dans results.
    if (ctrl.scene === 'grid' && ['EC', 'MQ'].includes(ctrl.sessionType) && session) {
      const order = await getGridOrder(session, sessions, reg, await meetingsOf(reg));
      // dernière manche ? → on affiche les points championnat (interimPoints) dans l'intermédiaire
      const mqNums = sessions.filter(s => s.type === 'MQ').map(s => s.num ?? 1);
      const isLastManche = ctrl.sessionType === 'MQ' && mqNums.length && (ctrl.sessionNum ?? 1) === Math.max(...mqNums);
      let prevIds = null;     // pilotes déjà classés (pour détecter les nouveaux → flash)
      let lastAddedId = null; // pilote en surbrillance (reste jusqu'à la saisie suivante)
      let lastResults = [];   // derniers résultats reçus (pour re-render différé)
      // Référence "remontada" : classement intermédiaire AVANT cette manche (fixe)
      const baselinePos = {};
      if (ctrl.sessionType === 'MQ') {
        (await getInterimBefore(ctrl.meetingId, ctrl.category, reg, session).catch(() => []))
          .forEach(r => { baselinePos[r.driverId] = r.position; });
      }
      const hasBaseline = Object.keys(baselinePos).length > 0;
      const renderSess = async (results) => {
        if (results) lastResults = results;
        const resMap = {};
        lastResults.forEach(r => { resMap[r.driverId] = r; });
        const hasRun = id => !!(resMap[id] && (resMap[id].ms != null || resMap[id].status));
        const rank = ctrl.sessionType === 'EC'
          ? await getEcRank(sessions, reg).catch(() => [])
          : await getMqRank(session, reg).catch(() => []);
        const curIds = new Set(rank.map(r => r.driverId).filter(Boolean));
        // nouveau(x) ce render → fondu une seule fois ; le dernier garde la barre
        let flashIds = new Set();
        if (prevIds) {
          const newcomers = [...curIds].filter(id => !prevIds.has(id));
          if (newcomers.length) {
            flashIds = new Set(newcomers);
            lastAddedId = newcomers[newcomers.length - 1];
            if (sessTimer) { clearTimeout(sessTimer); sessTimer = null; }
          }
        }
        const mark = r => {
          if (!r.driverId) return;
          if (r.driverId === lastAddedId) r.justAdded = true;   // barre persistante
          if (flashIds.has(r.driverId)) r.justFlashed = true;   // fondu (à l'entrée)
        };
        rank.forEach(mark);
        const todo = order.filter(o => !hasRun(o.driverId)).map((o, i) => ({ pos: i + 1, carNumber: o.carNumber, lastName: o.lastName }));
        const data = {
          mode: ctrl.sessionType === 'EC' ? 'ec' : 'mq',
          headerText, sessionLabel: `${sLabel} · ${catName}`,
          todo, rank, videoLayout: ctrl.videoLayout,
          predict: await computePredict(ctrl, reg, session, rank).catch(() => null),
        };
        // Classement intermédiaire : pertinent à partir de la manche 2 (≥ 2 manches).
        // En manche 1, on masque la colonne (vue 2 colonnes).
        if (ctrl.sessionType === 'MQ' && (ctrl.sessionNum ?? 1) >= 2) {
          // intermédiaire "live" : la manche en cours compte ses points provisoires
          // (mêmes que la colonne manche), pour que les deux colonnes collent en direct.
          const interim = (await getInterimLive(ctrl.meetingId, ctrl.category, reg, session, rank).catch(() => []))
            .map(r => ({ driverId: r.driverId, position: r.position, carNumber: r.carNumber, lastName: r.lastName,
              totalPoints: r.totalPoints, done: hasRun(r.driverId),       // done = déjà un résultat dans CETTE manche
              champPts: isLastManche ? (r.interimPoints ?? 0) : null }));  // pts championnat (dernière manche)
          if (hasBaseline) interim.forEach(r => {             // delta = places gagnées depuis AVANT la manche
            r.delta = baselinePos[r.driverId] != null ? baselinePos[r.driverId] - r.position : 'new';
          });
          interim.forEach(mark);
          data.interim = interim;
        }
        // manche terminée (plus personne à passer) → graphique d'évolution à droite
        if (ctrl.sessionType === 'MQ' && todo.length === 0) {
          const evo = await getInterimEvolution(ctrl.meetingId, ctrl.category, reg, session).catch(() => null);
          if (evo && evo.series.length >= 2) data.graph = { ...evo, mode: ctrl.graphMode === 'points' ? 'points' : 'places' };
        }
        if (!alive()) return;
        root.innerHTML = renderScene('session', data);
        prevIds = curIds;
        // dernier de la manche (plus personne à passer) → effacer la surbrillance après 10 s
        if (lastAddedId && todo.length === 0 && !sessTimer) {
          sessTimer = setTimeout(() => { lastAddedId = null; sessTimer = null; renderSess(null); }, 10000);
        }
      };
      const uSess = await watchQuery('results', [['sessionId', '==', session.id]], freshThenDebounce(rows => renderSess(rows)));
      if (!alive()) { uSess(); return; }
      unsubResults = uSess;
      return;
    }

    // Scène "Grille" pour DEMI-FINALES / FINALE : grille en haut (qui part où) +
    // résultats & points en bas, en direct. Encadrements/barres : DF = qualifiés (bleu)
    // / éliminés (rouge), FIN = podium (or/argent/bronze).
    if (ctrl.scene === 'grid' && ['DF', 'FIN'].includes(ctrl.sessionType) && session) {
      const ov = ctrl.gridOverride;
      const slots = (ov && ov.key === sessionKey(ctrl) && ov.slots?.length)
        ? ov.slots
        : await getGridOrder(session, sessions, reg, await meetingsOf(reg));
      const layout   = getGridLayout(reg, ctrl.sessionType);
      const poleSide = meeting?.poleSide || null;
      // nombre de qualifiés par demi-finale : lu dans le règlement (pas en dur)
      const qualify  = reg.sessionConfig?.DF?.qualifiedPerDF;
      const renderCombo = async () => {
        const results = await getPhaseRank(session, reg).catch(() => []);
        if (!alive()) return;
        root.innerHTML = renderScene('grid', {
          phase: ctrl.sessionType, qualify,
          headerText, sessionLabel: `${sLabel} · ${catName}`,
          layout, slots, poleSide, results,
        });
      };
      const uCombo = await watchQuery('results', [['sessionId', '==', session.id]], freshThenDebounce(() => renderCombo()));
      if (!alive()) { uCombo(); return; }
      unsubResults = uCombo;
      return;
    }

    // Grille (override d'affichage prioritaire si la clé correspond)
    let slots = [];
    if (['grid', 'next-heat'].includes(ctrl.scene)) {
      const ov = ctrl.gridOverride;
      if (ov && ov.key === sessionKey(ctrl) && ov.slots?.length) {
        slots = ov.slots;
      } else if (session) {
        slots = await getGridOrder(session, sessions, reg, await meetingsOf(reg));
      }
    }
    const layout = getGridLayout(reg, ctrl.sessionType);
    // sens du 1er virage (pole gauche/droite) pour la grille en quinconce
    const poleSide = (ctrl.scene === 'grid' && Object.keys(layout.positions || {}).length)
      ? (meeting?.poleSide || null) : null;

    // Championnat : référence AVANT l'épreuve (meeting exclu), calculée 1 fois (mise en cache) ;
    // puis on ajoute en direct les points du meeting en cours (léger) → total + flèches + (+meeting).
    let champBeforeTot = {}, champBeforePos = {}, drvInfo = {};
    if (ctrl.scene === 'dashboard') {
      const base = await championshipBaseline(reg, ctrl.meetingId, ctrl.category);
      champBeforeTot = base.tot; champBeforePos = base.pos;
      drvInfo = { ...base.info };   // copie : buildChamp ajoute les pilotes du meeting en cours (ne pas polluer le cache)
    }
    const hasChampBefore = Object.keys(champBeforeTot).length > 0;

    // Dashboard QF/DF/FIN : pilotes engagés dans la session courante → surbrillance bleue
    // dans l'intermédiaire (qui est en finale / qui court cette demi).
    const isPhaseDash  = ctrl.scene === 'dashboard' && ['QF', 'DF', 'FIN'].includes(ctrl.sessionType) && !!session;
    const isFinaleDash = ctrl.scene === 'dashboard' && ctrl.sessionType === 'FIN' && !!session;
    const engagedIds = new Set();
    if (isPhaseDash) (await getParticipants(session.id).catch(() => [])).forEach(p => engagedIds.add(p.driverId));

    const buildChamp = async () => {
      const cur = await getMeetingPoints(ctrl.meetingId, ctrl.category, reg, session).catch(() => []);
      const curTot = {};
      cur.forEach(d => { curTot[d.driverId] = d.total; if (!drvInfo[d.driverId]) drvInfo[d.driverId] = d; });
      const ids = new Set([...Object.keys(champBeforeTot), ...Object.keys(curTot)]);
      const rows = [...ids].map(id => ({
        driverId: id, carNumber: drvInfo[id]?.carNumber, lastName: drvInfo[id]?.lastName,
        grandTotal: (champBeforeTot[id] || 0) + (curTot[id] || 0),
        meetingPts: hasChampBefore ? (curTot[id] || 0) : null,
      }));
      rows.sort((a, b) => b.grandTotal - a.grandTotal);
      let cp = 1;
      rows.forEach((r, i) => {
        r.position = (i > 0 && r.grandTotal === rows[i - 1].grandTotal) ? rows[i - 1].position : cp;
        cp = i + 2;
        r.delta = hasChampBefore ? (champBeforePos[r.driverId] != null ? champBeforePos[r.driverId] - r.position : 'new') : null;
      });
      return rows;
    };

    // Fonction de rendu (recalcule intermédiaire + championnat à chaque tick résultats)
    const renderNow = async (raceResults) => {
      const data = {
        headerText, category: catName, sessionLabel: sLabel,
        raceSub: `${catName} · ${sLabel}`, interimSub: '',
        champSub: `${catName} · ${reg.year}`, social: headerText,
        layout, slots, poleSide, videoLayout: ctrl.videoLayout,
      };
      if (ctrl.scene === 'dashboard') {
        data.race    = sortRace(raceResults || []);
        // intermédiaire "live" (manche en cours en provisoire) ; définitif pour les autres phases
        data.interim = await getInterimLive(ctrl.meetingId, ctrl.category, reg, session).catch(() => []);
        data.champ   = await buildChamp();
        if (isFinaleDash) {   // finale : 4e panneau "meeting" + colonnes pleine hauteur
          data.interimSub = 'finalistes en bleu';
          data.meetingSub = 'cumul épreuve';
          data.meeting    = await getMeetingStandings(ctrl.meetingId, ctrl.category, reg, session).catch(() => []);
        } else if (['QF', 'DF'].includes(ctrl.sessionType) || (ctrl.sessionType === 'MQ' && (ctrl.sessionNum ?? 1) >= 2)) {
          data.threeCol = true;             // dashboard 3 colonnes : course | intermédiaire | championnat
          if (['QF', 'DF'].includes(ctrl.sessionType)) data.interimSub = 'engagés en bleu';
        }
        // surbrillance bleue des pilotes engagés dans la demi / la finale
        if (isPhaseDash) data.interim.forEach(r => { if (engagedIds.has(r.driverId)) r.finalist = true; });
        // titre du panneau course selon la phase (sinon "Manche en cours" par défaut)
        data.raceTitle = { QF: 'Quart de finale en cours', DF: 'Demi-finale en cours', FIN: 'Finale en cours' }[ctrl.sessionType];
        // bandeau prédiction recalculé en direct (abandons figés)
        data.predict = await computePredict(ctrl, reg, session).catch(() => null);
      }
      if (!alive()) return;
      root.innerHTML = renderScene(ctrl.scene, data);
    };

    if (ctrl.scene === 'dashboard' && session) {
      // Live : on s'abonne aux résultats de la session courante
      const uDash = await watchQuery('results', [['sessionId', '==', session.id]], freshThenDebounce(rows => renderNow(rows)));
      if (!alive()) { uDash(); return; }
      unsubResults = uDash;
    } else {
      await renderNow(session ? await getResults(session.id) : []);
    }
  }

  // Boucle de contrôle (avec reconnexion auto du listener)
  let ctrlUnsub = null;
  async function startControl() {
    if (ctrlUnsub) { ctrlUnsub(); ctrlUnsub = null; }
    ctrlUnsub = await watchControl(async (ctrl) => {
      applyVisibility(ctrl.visible);
      applyVideo(ctrl);   // source/placement vidéo : appliqué en direct (sans recharger la scène)
      applyInfoBand(ctrl);   // bandeau info / sponsors : appliqué en direct, par-dessus la scène
      const key = [ctrl.scene, ctrl.championshipId, ctrl.meetingId, ctrl.category,
                   ctrl.sessionType, ctrl.sessionNum, JSON.stringify(ctrl.gridOverride),
                   ctrl.headerText, ctrl.nextText, ctrl.countdownEnd, ctrl.graphMode,
                   JSON.stringify(ctrl.predict), ctrl.videoLayout, JSON.stringify(ctrl.fiche), ctrl.pronosticId, ctrl.spectatorBaseUrl].join('|');
      if (key === cacheKey) return;   // rien de pertinent n'a changé
      cacheKey = key;
      lastControl = ctrl;
      try { await reload(ctrl); }
      catch (e) { console.error('[overlay] reload', e); diag('Erreur de chargement', e.message); }
    }, (err) => {
      diag('Erreur Firestore', err.code === 'permission-denied'
        ? 'Règle « obsControl » manquante — ajoute-la dans la console Firebase (voir README).'
        : (err.code || err.message));
      cacheKey = '';
      setTimeout(startControl, 5000);   // reconnexion auto (règle ajoutée, coupure réseau…)
    });
  }
  startControl();
</script>
