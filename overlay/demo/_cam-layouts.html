<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Barlow+Condensed:wght@400;500;600;700&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--orange:#ff5500;--panel:rgba(7,9,13,.97);--line:rgba(255,255,255,.08);--gold:#ffcc33;--green:#39d98a;--mut:#8b95a4}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#0a0c11;font-family:'Exo 2',sans-serif;color:#fff}
  .stage{position:absolute;inset:0}
  /* ── caméra (placeholder) ── */
  .cam{position:absolute;background:linear-gradient(135deg,#1b2735,#0c1119);border:1px solid #2b3445;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;z-index:1}
  .cam::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 2px,transparent 2px 7px)}
  .cam .ico{font-size:52px;opacity:.6}
  .cam .lbl{font-family:'Barlow Condensed';font-weight:600;font-size:22px;letter-spacing:2px;color:#9fb4d8;text-transform:uppercase;z-index:1}
  .cam .rec{position:absolute;top:14px;left:16px;display:flex;align-items:center;gap:7px;font-family:'Orbitron';font-weight:800;font-size:13px;letter-spacing:2px;color:#ff5f5f;z-index:1}
  .cam .rec i{width:11px;height:11px;border-radius:50%;background:#ff3b3b;display:inline-block}
  /* ── en-tête ── */
  .hdr{position:absolute;top:0;left:0;right:0;height:88px;display:flex;align-items:center;gap:20px;padding:0 40px;z-index:10;
    background:linear-gradient(100deg,#141a24,#0a0c11);border-bottom:3px solid var(--orange)}
  .hdr .brand{font-family:'Orbitron';font-weight:900;font-size:28px}.hdr .brand b{color:var(--orange)}
  .hdr .sep{width:2px;height:38px;background:var(--line)}
  .hdr .info{font-family:'Barlow Condensed';font-weight:600;font-size:24px;letter-spacing:2px;text-transform:uppercase;color:#dbe3ee}
  .hdr .live{margin-left:auto;display:flex;align-items:center;gap:8px;background:#e11d2a;padding:7px 13px;border-radius:6px;font-family:'Orbitron';font-weight:800;font-size:14px;letter-spacing:2px}
  .hdr .live i{width:10px;height:10px;border-radius:50%;background:#fff;display:inline-block}
  /* ── panneaux ── */
  .panel{position:absolute;background:var(--panel);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 0 0 1px rgba(255,255,255,.06);z-index:5}
  .panel .h{display:flex;align-items:center;padding:11px 18px;font-family:'Orbitron';font-weight:800;font-size:18px;
    letter-spacing:.5px;text-transform:uppercase;background:linear-gradient(100deg,var(--orange),#c23d00 80%)}
  .panel .h.alt{background:linear-gradient(100deg,#33405a,#1c2433)}
  .panel .h .s{margin-left:auto;font-family:'Barlow Condensed';font-weight:600;font-size:14px;letter-spacing:2px;opacity:.9}
  .panel .b{flex:1;display:flex;flex-direction:column;padding:3px 0;min-height:0}
  .r{display:grid;grid-template-columns:40px 52px 1fr auto;align-items:center;gap:10px;padding:0 16px;flex:1;min-height:0;
    font-family:'Barlow Condensed';border-top:1px solid var(--line)}
  .r:first-child{border-top:0}
  .r.p1{background:linear-gradient(90deg,rgba(255,85,0,.18),transparent 70%)}
  .r .p{font-family:'Orbitron';font-weight:800;font-size:19px;color:#9aa4b2;text-align:center}
  .r.p1 .p{color:var(--orange)}
  .r .n{display:inline-flex;align-items:center;justify-content:center;min-width:46px;height:30px;padding:0 7px;border-radius:6px;
    background:#1b2230;border:1px solid #2b3445;font-family:'Orbitron';font-weight:700;font-size:16px;color:#dfe6f0}
  .r .nm{font-weight:600;font-size:22px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .r .v{font-family:'Orbitron';font-weight:700;font-size:19px;color:var(--gold);text-align:right}
  .r.dense{ }
  .dense .p{font-size:16px}.dense .nm{font-size:19px}.dense .n{height:26px;min-width:42px;font-size:14px}.dense .v{font-size:16px}
  /* ── lower-third (plein écran) ── */
  .lt{position:absolute;left:0;right:0;bottom:0;height:184px;z-index:10;
    background:linear-gradient(0deg,rgba(6,8,14,.97),rgba(6,8,14,.75) 60%,transparent);padding:24px 40px 26px;display:flex;flex-direction:column;gap:12px}
  .lt .cap{display:flex;align-items:center;gap:14px;font-family:'Orbitron';font-weight:800;font-size:20px;letter-spacing:1px;text-transform:uppercase}
  .lt .cap b{color:var(--orange)}
  .lt .chips{display:flex;gap:14px;overflow:hidden}
  .chip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 16px}
  .chip .p{font-family:'Orbitron';font-weight:800;font-size:20px;color:var(--orange)}
  .chip .n{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:32px;padding:0 7px;border-radius:6px;background:#1b2230;border:1px solid #2b3445;font-family:'Orbitron';font-weight:700;font-size:16px}
  .chip .nm{font-family:'Barlow Condensed';font-weight:600;font-size:24px;text-transform:uppercase}
  .chip .v{font-family:'Orbitron';font-weight:700;font-size:18px;color:var(--gold)}
  /* légende du mode (repère maquette) */
  .tag{position:absolute;top:100px;left:40px;z-index:20;background:rgba(255,85,0,.14);border:1px solid rgba(255,85,0,.5);
    border-radius:8px;padding:7px 14px;font-family:'Barlow Condensed';font-weight:600;font-size:17px;letter-spacing:1px;color:#ffca9e}
</style></head>
<body>
<div class="stage" id="stage"></div>
<script>
const N=['Grondin','Boulbès','Lefebvre','Dubourg','Mailloux','André','Renard','Caillot','Morel','Picard','Bedouet','Le Lay'];
const NO=[11,2,77,4,33,9,21,5,14,8,69,22];
const INT=(n)=>Array.from({length:n},(_,i)=>({p:i+1,n:NO[i],nm:N[i],v:(135-i*5)+' pt'}));
const rowHtml=(r,i,dense)=>`<div class="r ${i===0?'p1':''} ${dense?'dense':''}"><span class="p">${r.p}</span><span class="n">${r.n}</span><span class="nm">${r.nm}</span><span class="v">${r.v}</span></div>`;
const panel=(title,sub,list,alt,dense)=>`<div class="h ${alt?'alt':''}">${title}${sub?`<span class="s">${sub}</span>`:''}</div><div class="b">${list.map((r,i)=>rowHtml(r,i,dense)).join('')}</div>`;
const cam=(lbl)=>`<div class="rec"><i></i>REC</div><div class="ico">📹</div><div class="lbl">${lbl}</div>`;
const hdr=`<div class="hdr"><span class="brand">RX<b>CHRONO</b></span><span class="sep"></span><span class="info">📍 Lohéac · Supercar · Manche 4</span><span class="live"><i></i>LIVE</span></div>`;

const layout=new URLSearchParams(location.search).get('layout')||'none';
const S=document.getElementById('stage');
const tag=t=>``;
const P=(cls,style,html)=>`<div class="panel" style="${style}"><div style="display:contents">${html}</div></div>`.replace('class="panel"',`class="panel ${cls||''}"`);

if(layout==='none'){
  S.innerHTML=hdr+tag('AUCUNE — tableaux plein écran (comme aujourd\'hui)')
    +P('','left:40px;top:104px;width:600px;bottom:32px',panel('Manche en cours','en direct',INT(9)))
    +P('','left:660px;top:104px;width:600px;bottom:32px',panel('Classement intermédiaire','après M4',INT(9),true))
    +P('','left:1280px;top:104px;width:600px;bottom:32px',panel('Championnat','2026',INT(9),true));
}
else if(layout==='corner'){
  S.innerHTML=hdr+tag('COIN — caméra en incrustation, les tableaux réservent le coin')
    +P('','left:40px;top:104px;width:590px;bottom:32px',panel('Manche en cours','en direct',INT(9)))
    +P('','left:648px;top:104px;width:590px;bottom:32px',panel('Classement intermédiaire','',INT(9),true))
    +P('','left:1256px;top:104px;width:624px;height:560px',panel('Championnat','top 6',INT(6),true))
    +`<div class="cam" style="right:40px;bottom:32px;width:624px;height:352px;border-radius:13px">${cam('Caméra — webcam / R50')}</div>`;
}
else if(layout==='lateral'){
  S.innerHTML=hdr+tag('CENTRE / GRANDE — vidéo à gauche, tableaux en rail à droite')
    +`<div class="cam" style="left:40px;top:104px;width:1180px;bottom:32px;border-radius:14px">${cam('Caméra — plan large / face-cam')}</div>`
    +P('','left:1256px;top:104px;width:624px;height:600px',panel('Classement intermédiaire','après M4',INT(11),true,true))
    +P('','left:1256px;top:724px;width:624px;bottom:32px',panel('Championnat','top 5',INT(5),true,true));
}
else if(layout==='fullscreen'){
  S.innerHTML=`<div class="cam" style="inset:0">${cam('Caméra — plein écran')}</div>`+hdr
    +`<div class="lt"><div class="cap">📊 <b>Classement intermédiaire</b> · Supercar · après M4</div><div class="chips">`
    +INT(6).map(r=>`<div class="chip"><span class="p">${r.p}</span><span class="n">${r.n}</span><span class="nm">${r.nm}</span><span class="v">${r.v}</span></div>`).join('')
    +`</div></div>`;
}
</script>
</body></html>
